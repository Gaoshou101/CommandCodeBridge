# Merge into a CPA configuration. Docker deployments need container paths.
plugins:
  enabled: true
  dir: /CLIProxyAPI/plugins
  configs:
    commandcodebridge:
      enabled: true
      data_dir: /CLIProxyAPI/commandcodebridge-data
      base_url: https://api.commandcode.ai
      # Empty paths enable same-host native CPAMP discovery (default ~/cpa-manager-plus).
      # The console Settings page can override these and install the bundled panel.
      cpamp_install_dir: ""
      cpamp_config_path: ""
      cpamp_panel_path: ""
      # Browser OAuth uses a local POST receiver and CPAMP result submission.
      timeout_seconds: 1800
      # Optional stall guards inside timeout_seconds (0 = off, otherwise 5-1800):
      # time to the first upstream response data, and the longest gap between chunks.
      first_byte_timeout_seconds: 0
      stream_idle_timeout_seconds: 0
      usage_refresh_seconds: 60
      log_retention: 1000
      max_response_bytes: 16777216
      zdr: false
      # Import from the console. Never put upstream keys here.
      models: []
