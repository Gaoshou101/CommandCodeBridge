name: Test and build native plugins
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    needs: cpamp-web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: commandcodebridge-cpamp-web
          path: dist/cpamp-web
      - name: Embed the matching native CPAMP panel
        run: python3 scripts/embed_cpamp_panel.py dist/cpamp-web/*_cpamp-web.zip
      - run: go test -race ./...
      - run: go vet ./...
      - run: node --test tests/*.test.cjs
      - name: Native host integration (CPA v8.0.23)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist /tmp/cpa-test
          go build -trimpath -buildvcs=false -buildmode=c-shared -o dist/commandcodebridge.so ./cmd/commandcodebridge
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o dist/commandcodebridge-login ./cmd/commandcodebridge-login
          gh release download v8.0.23 --repo router-for-me/CLIProxyAPI --pattern CLIProxyAPI_8.0.23_linux_amd64.tar.gz --pattern checksums.txt --dir /tmp/cpa-test
          cd /tmp/cpa-test
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf CLIProxyAPI_8.0.23_linux_amd64.tar.gz
          cd "$GITHUB_WORKSPACE"
          CPA_BINARY=/tmp/cpa-test/cli-proxy-api python3 tests/cpa_e2e.py
          CPA_BINARY=/tmp/cpa-test/cli-proxy-api python3 tests/cpa_native_management.py
          CPA_BINARY=/tmp/cpa-test/cli-proxy-api python3 tests/cpa_reliability.py
          CPA_BINARY=/tmp/cpa-test/cli-proxy-api python3 tests/cpa_diagnostics.py
          CPA_BINARY=/tmp/cpa-test/cli-proxy-api python3 tests/cpa_round2.py
          gh release download v0.2.8 --repo Gaoshou101/CommandCodeBridge --pattern commandcodebridge_0.2.8_linux_amd64.zip --pattern checksums.txt --dir /tmp/bridge-previous
          cd /tmp/bridge-previous
          sha256sum --check --ignore-missing checksums.txt
          cd "$GITHUB_WORKSPACE"
          CPA_BINARY=/tmp/cpa-test/cli-proxy-api python3 tests/cpa_hot_reload.py --previous-archive /tmp/bridge-previous/commandcodebridge_0.2.8_linux_amd64.zip
      - uses: actions/download-artifact@v4
        with:
          name: cpamp-manager-test
          path: dist/cpamp-manager-test
      - name: Native panel deployment against the same CPAMP source baseline
        run: |
          chmod +x dist/cpamp-manager-test/cpa-manager-plus
          CPA_BINARY=/tmp/cpa-test/cli-proxy-api CPAMP_BINARY="$PWD/dist/cpamp-manager-test/cpa-manager-plus" python3 tests/cpamp_native_panel.py
          CPA_BINARY=/tmp/cpa-test/cli-proxy-api CPAMP_BINARY="$PWD/dist/cpamp-manager-test/cpa-manager-plus" python3 tests/cpamp_native_panel.py --environment-only

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-amd64
            extension: so
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            extension: so
          - runner: windows-2022
            target: windows-amd64
            extension: dll
          - runner: macos-14
            target: darwin-arm64
            extension: dylib
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: commandcodebridge-cpamp-web
          path: dist/cpamp-web
      - name: Embed the matching native CPAMP panel
        shell: bash
        run: python scripts/embed_cpamp_panel.py dist/cpamp-web/*_cpamp-web.zip
      - name: Build shared library
        shell: bash
        env:
          CGO_ENABLED: '1'
          REPOSITORY: https://github.com/${{ github.repository }}
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=false -buildmode=c-shared -ldflags="-s -w -X commandcodebridge/internal/bridge.Repository=$REPOSITORY" -o dist/commandcodebridge.${{ matrix.extension }} ./cmd/commandcodebridge
          helper=dist/commandcodebridge-login
          if [ "${{ matrix.target }}" = windows-amd64 ]; then helper="$helper.exe"; fi
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w" -o "$helper" ./cmd/commandcodebridge-login
          python scripts/package.py dist/commandcodebridge.${{ matrix.extension }} --target ${{ matrix.target }}
      - name: Windows native host integration
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $taskDir = Join-Path $env:RUNNER_TEMP 'cpa-test'
          New-Item -ItemType Directory -Force -Path $taskDir | Out-Null
          gh release download v8.0.23 --repo router-for-me/CLIProxyAPI --pattern CLIProxyAPI_8.0.23_windows_amd64.zip --pattern checksums.txt --dir $taskDir
          $archive = Join-Path $taskDir 'CLIProxyAPI_8.0.23_windows_amd64.zip'
          $line = Get-Content (Join-Path $taskDir 'checksums.txt') | Where-Object { $_ -match 'CLIProxyAPI_8.0.23_windows_amd64.zip$' }
          if ((Get-FileHash $archive).Hash.ToLower() -ne ($line -split '\s+')[0]) { throw 'CPA checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $taskDir
          $env:CPA_BINARY = Join-Path $taskDir 'cli-proxy-api.exe'
          $env:BRIDGE_LIBRARY = Join-Path $env:GITHUB_WORKSPACE 'dist/commandcodebridge.dll'
          go test ./internal/bridge -run 'TestCredentialDeletion|TestNativePanel' -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Windows credential deletion/native panel regressions failed' }
          python tests/cpa_e2e.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows native host integration failed' }
          python tests/cpa_native_management.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows native management integration failed' }
          python tests/cpa_reliability.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows reliability integration failed' }
          python tests/cpa_diagnostics.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows diagnostics integration failed' }
          python tests/cpa_round2.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows round two integration failed' }
          python tests/cpa_hot_reload.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows live configuration integration failed' }
      - name: ARM64 native host integration
        if: matrix.target == 'linux-arm64' || matrix.target == 'darwin-arm64'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          task_dir="$RUNNER_TEMP/cpa-test"
          mkdir -p "$task_dir"
          if [ "${{ matrix.target }}" = linux-arm64 ]; then
            archive=CLIProxyAPI_8.0.23_linux_aarch64.tar.gz
          else
            archive=CLIProxyAPI_8.0.23_darwin_aarch64.tar.gz
          fi
          gh release download v8.0.23 --repo router-for-me/CLIProxyAPI --pattern "$archive" --pattern checksums.txt --dir "$task_dir"
          python - "$task_dir" "$archive" <<'PY'
          import hashlib, pathlib, sys, tarfile
          folder, name = pathlib.Path(sys.argv[1]), sys.argv[2]
          expected = next(line.split()[0] for line in (folder / "checksums.txt").read_text().splitlines() if line.split()[-1] == name)
          assert hashlib.sha256((folder / name).read_bytes()).hexdigest() == expected
          with tarfile.open(folder / name) as archive:
              archive.extractall(folder, filter="data")
          PY
          export CPA_BINARY="$task_dir/cli-proxy-api"
          export BRIDGE_LIBRARY="$GITHUB_WORKSPACE/dist/commandcodebridge.${{ matrix.extension }}"
          python tests/cpa_e2e.py
          python tests/cpa_native_management.py
          python tests/cpa_reliability.py
          python tests/cpa_hot_reload.py
      - uses: actions/upload-artifact@v4
        with:
          name: commandcodebridge-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.sha256

  cpamp-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Regression tests for CPAMP identity and release gates
        run: python -m unittest discover -s tests -p 'test_cpamp_panel_validation.py' -v
      - name: Read the CPAMP source baseline
        id: cpamp-baseline
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from integrations.cpamp.panel_validation import load_compatibility
          baseline = load_compatibility(Path.cwd())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + baseline['cpamp_source_commit'] + '\n')
          PY
      - name: Build the pinned CPAMP native quota integration
        shell: bash
        env:
          CPAMP_SOURCE_COMMIT: ${{ steps.cpamp-baseline.outputs.commit }}
        run: |
          cpamp_source="$RUNNER_TEMP/cpamp-source"
          git clone --filter=blob:none https://github.com/seakee/CPA-Manager-Plus.git "$cpamp_source"
          git -C "$cpamp_source" checkout --detach "$CPAMP_SOURCE_COMMIT"
          export VERSION="commandcodebridge-integration-${CPAMP_SOURCE_COMMIT:0:12}"
          python integrations/cpamp/apply.py "$cpamp_source" --check
          python integrations/cpamp/apply.py "$cpamp_source"
          cd "$cpamp_source"
          npm ci --ignore-scripts --workspace apps/web
          npm --workspace apps/web run type-check
          npm --workspace apps/web run test -- src/utils/quota/constants.test.ts src/features/accounts/components/CommandCodeQuotaCard.test.tsx src/features/accounts/components/commandCodeQuotaStore.test.ts src/features/accounts/model/commandCodeQuotaWindows.test.ts src/features/accounts/model/accountHealthEvidence.test.ts src/features/accounts/model/accountQuotaWindowDefinitions.test.ts src/features/accounts/components/QuotaWindowCard.test.tsx src/services/api/CommandCodeOAuth.test.ts src/services/api/oauth.test.ts src/features/oauth/OAuthPage.test.tsx src/features/accounts/components/accountDetail/AccountQuotaTab.test.tsx
          npm --workspace apps/web run build
          (cd apps/manager-server && go test ./internal/service/quotasnapshot ./internal/http/controller/health -run TestCommandCode -count=1)
          cd "$GITHUB_WORKSPACE"
          mkdir -p dist/cpamp-manager-test
          (cd "$cpamp_source/apps/manager-server" && go build -trimpath -o "$GITHUB_WORKSPACE/dist/cpamp-manager-test/cpa-manager-plus" ./cmd/cpa-manager-plus)
          python scripts/package_cpamp.py "$cpamp_source"
          python - "$cpamp_source" <<'PY'
          import pathlib, subprocess, sys, tempfile, zipfile
          archive = next(pathlib.Path("dist").glob("*_cpamp-web.zip"))
          with tempfile.TemporaryDirectory(prefix="cpamp-release-check-") as temporary:
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(temporary)
              script = pathlib.Path(temporary) / "integrations/cpamp/apply.py"
              subprocess.run([sys.executable, str(script), sys.argv[1], "--check"], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cpamp-manager-test
          path: dist/cpamp-manager-test/cpa-manager-plus
      - uses: actions/upload-artifact@v4
        with:
          name: commandcodebridge-cpamp-web
          path: |
            dist/*_cpamp-web.zip
            dist/*_cpamp-web.zip.sha256

  upstream-compatibility:
    needs: cpamp-web
    runs-on: ubuntu-24.04
    # Report candidate compatibility without changing the pinned release gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: commandcodebridge-cpamp-web
          path: dist/cpamp-web
      - name: Test the latest CPA release as a candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/upstream-compatibility
          candidate="$(gh release view --repo router-for-me/CLIProxyAPI --json tagName --jq .tagName)"
          printf 'Pinned baseline: v8.0.23\nCandidate: %s\n' "$candidate" > dist/upstream-compatibility/result.txt
          archive="CLIProxyAPI_${candidate#v}_linux_amd64.tar.gz"
          gh release download "$candidate" --repo router-for-me/CLIProxyAPI --pattern "$archive" --pattern checksums.txt --dir dist/upstream-compatibility
          (cd dist/upstream-compatibility && sha256sum --check --ignore-missing checksums.txt && tar -xzf "$archive")
          python scripts/embed_cpamp_panel.py dist/cpamp-web/*_cpamp-web.zip
          go build -trimpath -buildvcs=false -buildmode=c-shared -o dist/upstream-compatibility/commandcodebridge.so ./cmd/commandcodebridge
          export CPA_BINARY="$PWD/dist/upstream-compatibility/cli-proxy-api"
          export BRIDGE_LIBRARY="$PWD/dist/upstream-compatibility/commandcodebridge.so"
          python tests/cpa_e2e.py 2>&1 | tee -a dist/upstream-compatibility/result.txt
          python tests/cpa_reliability.py 2>&1 | tee -a dist/upstream-compatibility/result.txt
          python tests/cpa_diagnostics.py 2>&1 | tee -a dist/upstream-compatibility/result.txt
      - name: Record candidate result
        if: always()
        shell: bash
        run: |
          echo '## CPA candidate compatibility' >> "$GITHUB_STEP_SUMMARY"
          if [ -f dist/upstream-compatibility/result.txt ]; then cat dist/upstream-compatibility/result.txt >> "$GITHUB_STEP_SUMMARY"; fi
          echo 'The candidate result does not change the pinned supported baseline.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-cpa-compatibility-report
          path: dist/upstream-compatibility/result.txt

  release-checksums:
    needs: [build, cpamp-web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: commandcodebridge-*
          path: dist
          merge-multiple: true
      - run: python scripts/checksums.py dist --include-cpamp
      - uses: actions/upload-artifact@v4
        with:
          name: commandcodebridge-checksums
          path: dist/checksums.txt

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, release-checksums]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: commandcodebridge-*
          path: dist
          merge-multiple: true
      - name: Verify release provenance and prepare notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/checksums.py dist --include-cpamp
          python - <<'PY'
          import json, os, pathlib, re, zipfile
          version = re.search(r'const Version = "([^"]+)"', pathlib.Path('internal/bridge/types.go').read_text()).group(1)
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'tag/source version mismatch'
          for archive in pathlib.Path('dist').glob('*.zip'):
              with zipfile.ZipFile(archive) as bundle:
                  build = json.loads(bundle.read('BUILD.json'))
              assert build['version'] == version, archive.name
              source = build.get('integration_source_commit') if build.get('artifact') == 'cpamp-web' else build.get('source_commit')
              assert source == os.environ['GITHUB_SHA'], f'{archive.name}: wrong source commit'
          notes = pathlib.Path('docs/RELEASE_NOTES.md').read_text(encoding='utf-8')
          assert notes.splitlines()[2] == '## v' + version, 'release notes version mismatch'
          pathlib.Path('dist/release-notes.md').write_text(notes.split('\n## 已发布 ', 1)[0], encoding='utf-8')
          PY
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          state="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$state" = false ]; then
            echo 'Release is already published; refusing to replace assets.' >&2
            exit 1
          fi
          if [ "$state" != true ]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "CommandCodeBridge $RELEASE_TAG" --notes-file dist/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/*.zip dist/*.zip.sha256 dist/checksums.txt --clobber
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" = 11
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file dist/release-notes.md
